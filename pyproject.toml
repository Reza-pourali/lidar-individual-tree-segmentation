[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-tree-segmentation"
version = "0.1.0"
description = "Individual-tree LiDAR segmentation and structural metric extraction with a Cut Pursuit backend."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "laspy>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]
